# herdr configuration
# tmux設定 (~/.tmux.conf) から移植

[terminal]
# Fish shellを使用
default_shell = "/opt/homebrew/bin/fish"

[keys]
# Prefixキー: Ctrl+T（tmuxと同じ）
prefix = "ctrl+t"

# ペイン操作（Vim風キーバインド）
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# ペイン入れ替え（Shift+Vim風）
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# ペインサイクル・直前のペインに戻る
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+;"

# ペイン分割: | で垂直、- で水平（tmuxと同じ）
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# タブ操作
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# コピーモード（vi風）
copy_mode = "prefix+["

# リサイズモード
resize_mode = "prefix+r"

# デタッチ
detach = "prefix+q"

# ペインを閉じる
close_pane = "prefix+x"

# ズーム
zoom = "prefix+z"

# ペイン名前設定（tmuxの Prefix+T に相当）
rename_pane = "prefix+shift+p"

# ワークスペース
new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = "prefix+shift+1..9"

# エージェントフォーカス（Alt+数字で直接選択）
focus_agent = "prefix+alt+1..9"

# Worktree操作
new_worktree = "prefix+shift+g"

# ヘルプ
help = "prefix+?"

# サイドバー切り替え
toggle_sidebar = "prefix+b"

# lazygitをカスタムコマンドとして登録
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

[ui]
# マウス操作有効（tmuxと同じ）
mouse_capture = true

# ペインボーダー表示（tmuxのpane-border-statusに相当）
pane_borders = true
pane_gaps = true

# エージェントラベルをボーダーに表示
show_agent_labels_on_pane_borders = true

[ui.toast]
# 通知をシステム通知で表示（terminal-notifierの代替）
delivery = "system"

[ui.sound]
# エージェント状態変更時のサウンド通知
enabled = true

[experimental]
# CJK IME対応（日本語入力時にprefixが正しく動作するように）
switch_ascii_input_source_in_prefix = true
