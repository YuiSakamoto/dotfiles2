# herdr configuration
# tmux設定 (~/.tmux.conf) から移植

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#eba0ac"

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Prefixキー: Ctrl+T（tmuxと同じ）
prefix = "ctrl+t"

# ペイン操作（Vim風キーバインド）
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# ペイン入れ替え（Shift+Vim風）
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# ペインサイクル・直前のペインに戻る
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+;"

# ペイン分割: | で垂直、- で水平（tmuxと同じ）
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# タブ操作
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# コピーモード（vi風）
copy_mode = "prefix+["

# リサイズモード
resize_mode = "prefix+r"

# デタッチ
detach = "prefix+q"

# ペインを閉じる
close_pane = "prefix+x"

# ズーム
zoom = "prefix+z"

# ペイン名前設定（tmuxの Prefix+T に相当）
rename_pane = "prefix+shift+p"

# ワークスペース
new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = "prefix+shift+1..9"
navigate_workspace_up = "ctrl+k"
navigate_workspace_down = "ctrl+j"
# picker を開かず前後のワークスペースへ高速切替（デフォルト未割当）
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# エージェント移動
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"

# Worktree操作
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"

# セッションナビゲータ（デフォルト prefix+g は下の lazygit に譲って f に移設）
goto = "prefix+f"

# ヘルプ
help = "prefix+?"

# サイドバー切り替え
toggle_sidebar = "prefix+b"

# lazygitをカスタムコマンドとして登録
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = true
confirm_close = true
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
# 通知をシステム通知で表示（terminal-notifierの代替）
delivery = "system"

[ui.sound]
# エージェント状態変更時のサウンド通知
enabled = true

[experimental]
# CJK IME対応（日本語入力時にprefixが正しく動作するように）
switch_ascii_input_source_in_prefix = true
